name: Build Android APK

# Runs when you push to main/master, and when you trigger it by hand
# from the Actions tab. No PC needed: GitHub's servers do the build.
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # This project does not use the Gradle Wrapper (no gradlew jar),
      # so install Gradle 8.7 directly and run `gradle`, not `./gradlew`.
      # Gradle 8.7 matches gradle/wrapper/gradle-wrapper.properties.
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: warden-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
